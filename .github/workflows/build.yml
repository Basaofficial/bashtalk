name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace -Pvc=${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk BashTalk.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BashTalk
          path: BashTalk.apk

      - name: Notes
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          T=$(printf '%s\n' "$MSG" | head -n1 | sed -E 's/^v[0-9.]+: *//')
          printf '🆕 Nova verzija – %s\n' "${T:-poboljšanja}" > notes.txt

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "#Bash Talk v${{ github.run_number }}"
          files: BashTalk.apk
          body_path: notes.txt
          make_latest: true
