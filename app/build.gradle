plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.basa.bashtalk'
    compileSdk 36

    defaultConfig {
        applicationId 'com.basa.bashtalk'
        minSdk 24
        targetSdk 34
        def vc = (project.findProperty('vc') ?: '1').toString().toInteger()
        versionCode vc
        versionName "2.1.${vc}"
    }

    signingConfigs {
        bash {
            storeFile file('bashtalk.jks')
            storePassword 'bashtalk123'
            keyAlias 'bashtalk'
            keyPassword 'bashtalk123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.bash
        }
        debug {
            signingConfig signingConfigs.bash
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-nearby:19.3.0'
    implementation 'androidx.core.uwb:uwb:1.0.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
}
