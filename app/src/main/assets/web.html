<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>#Bash Talk (web)</title>
<style>
:root{--g:#8dff1a;--g2:#5fd400;--t:#e9ffe0;--mut:#7d8f72;--line:#1d2715;--card:#0a0d08;--card2:#11160d;--red:#ff3b4e;--yel:#ffd21a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;color:var(--t);font-family:-apple-system,system-ui,sans-serif}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);padding-top:max(12px,env(safe-area-inset-top))}
.logo{font-family:'Snell Roundhand','Dancing Script',cursive;font-size:28px;font-weight:700;color:var(--g);text-shadow:0 0 16px rgba(141,255,26,.5)}
.sp{flex:1}
.pill{padding:6px 11px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-size:13px;font-weight:700}
.pill b{color:var(--g)}
#bar{display:flex;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);overflow-x:auto}
.btn{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:9px 13px;font-weight:700;color:var(--t);font-size:14px;white-space:nowrap}
.btn.g{background:var(--g);color:#000;border-color:var(--g)}
.btn.on{background:rgba(141,255,26,.15);border-color:var(--g);color:var(--g)}
#msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px;-webkit-overflow-scrolling:touch}
.m{max-width:80%;padding:8px 12px;border-radius:16px;background:var(--card2);border:1px solid var(--line);align-self:flex-start;word-wrap:break-word}
.m .n{font-size:12px;font-weight:700;color:var(--g);margin-bottom:2px}
.m .x{font-size:15px;white-space:pre-wrap}
.m .tm{font-size:10px;color:var(--mut);text-align:right;margin-top:3px}
.m.me{align-self:flex-end;background:linear-gradient(135deg,#8dff1a,#5fd400);color:#041000;border:0}
.m.me .tm{color:#1d4a00}
.m img{max-width:100%;border-radius:10px;display:block;margin-top:4px}
.m audio{width:220px;margin-top:4px}
.sys{align-self:center;font-size:12px;color:var(--mut);padding:3px 10px}
.compose{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);padding-bottom:max(10px,env(safe-area-inset-bottom))}
.compose input[type=text]{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:22px;padding:11px 16px;color:var(--t);font-size:16px;outline:none}
.round{width:46px;height:46px;border-radius:50%;padding:0;font-size:20px}
#sos{display:none;background:#3a0008;border-bottom:2px solid var(--red);color:#fff;padding:12px 16px;font-weight:800;text-align:center;animation:bl 1s infinite}
@keyframes bl{50%{background:#7a0012}}
#login{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:30px;z-index:9}
#login input{width:100%;max-width:320px;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:14px;color:var(--t);font-size:17px;text-align:center}
.hint{color:var(--mut);font-size:13px;text-align:center;line-height:1.5}
#rx{display:none;text-align:center;color:var(--g);font-weight:800;padding:6px;font-size:14px}
</style>
</head>
<body>
<div id="login">
  <div class="logo" style="font-size:40px">#Bash Talk</div>
  <div class="hint">Web verzija za iPhone i druge uređaje<br>bez aplikacije · bez interneta</div>
  <input id="nm" placeholder="Tvoj nadimak" maxlength="20">
  <button class="btn g" id="go" style="width:100%;max-width:320px;padding:14px">Uđi</button>
</div>
<div id="app">
  <header><div class="logo">#Bash Talk</div><div class="sp"></div><div class="pill">👥 <b id="cnt">0</b></div><div class="pill">K<b id="ch">1</b></div></header>
  <div id="sos"></div>
  <div id="bar">
    <button class="btn" id="snd">🔇 Uključi zvuk</button>
    <button class="btn" id="img">📷 Slika</button>
    <input type="file" id="file" accept="image/*" style="display:none">
  </div>
  <div id="rx">🔊 Neko priča…</div>
  <div id="msgs"><div class="sys">Spojen preko <span id="host">—</span>. Glas slušaš uz „Uključi zvuk”. Mikrofon u pregledniku nije moguć bez interneta – piši poruke.</div></div>
  <div class="compose"><input type="text" id="inp" placeholder="Poruka…" maxlength="1000"><button class="btn g round" id="send">➤</button></div>
</div>
<script>
(function(){
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hm = ts => { const d = new Date(ts); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };
let id = localStorage.getItem('bt_web_id'); if (!id) { id = 'web' + Math.random().toString(16).slice(2, 14); localStorage.setItem('bt_web_id', id); }
let name = localStorage.getItem('bt_web_name') || '';
const seen = new Set();
let since = -1, aSince = -1;

function start(){
  $('#login').style.display = 'none';
  poll();
}
$('#nm').value = name;
$('#go').onclick = () => { name = $('#nm').value.trim() || 'iPhone'; localStorage.setItem('bt_web_name', name); start(); };
if (name) start();

function add(html){ const b = $('#msgs'); b.insertAdjacentHTML('beforeend', html); b.scrollTop = b.scrollHeight; }
function msg(m){
  if (seen.has(m.mid)) return; seen.add(m.mid);
  const me = m.id === id;
  let body = '';
  if (m.kind === 'img') body = `<img src="${esc(m.url)}">`;
  else if (m.kind === 'voice') body = `🎤 <audio controls src="${esc(m.url)}"></audio>`;
  else body = `<div class="x">${esc(m.text||'')}</div>`;
  add(`<div class="m ${me?'me':''}">${me?'':'<div class="n">'+esc(m.name)+'</div>'}${body}<div class="tm">${hm(m.ts||Date.now())}</div></div>`);
}

async function poll(){
  for (;;) {
    try {
      const r = await fetch(`/api/poll?id=${id}&name=${encodeURIComponent(name)}&since=${since}`);
      const j = await r.json();
      since = j.next;
      $('#ch').textContent = j.ch; $('#host').textContent = j.host;
      if (j.peers) $('#cnt').textContent = (j.peers.peers || []).length + 1;
      (j.events || []).forEach(e => {
        if (e.type === 'msg') msg(e.d);
        else if (e.type === 'media') msg(e.d);
      });
      const s = (j.sos || []).filter(x => x.on);
      $('#sos').style.display = s.length ? 'block' : 'none';
      $('#sos').textContent = s.length ? '🆘 SOS: ' + s.map(x => x.name + (x.reason ? ' – ' + x.reason : '')).join(', ') : '';
    } catch (e) { await new Promise(r => setTimeout(r, 2000)); }
  }
}

async function send(){
  const t = $('#inp').value.trim(); if (!t) return; $('#inp').value = '';
  try {
    const r = await fetch('/api/send', {method:'POST', body: JSON.stringify({id, name, text: t})});
    const j = await r.json();
    msg({mid: j.mid, id, name, text: t, ts: Date.now()});
  } catch (e) { add('<div class="sys">⚠️ Poruka nije poslana</div>'); }
}
$('#send').onclick = send;
$('#inp').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

// slika
$('#img').onclick = () => $('#file').click();
$('#file').onchange = () => {
  const f = $('#file').files[0]; if (!f) return;
  const img = new Image();
  img.onload = async () => {
    const sc = Math.min(1, 1280 / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const data = c.toDataURL('image/jpeg', 0.7);
    try {
      const r = await fetch('/api/img', {method:'POST', body: JSON.stringify({id, name, data, w:c.width, h:c.height})});
      const j = await r.json();
      msg({mid: j.mid, id, name, kind:'img', url: j.url, ts: Date.now()});
    } catch (e) { add('<div class="sys">⚠️ Slika nije poslana</div>'); }
  };
  img.src = URL.createObjectURL(f);
  $('#file').value = '';
};

// zvuk: µ-law 16 kHz → WebAudio 48 kHz
const DEC = new Float32Array(256);
for (let i = 0; i < 256; i++) { let x = ~i & 0xff, sg = x & 0x80, ex = (x >> 4) & 7, mn = x & 15; let s = (((mn << 3) + 0x84) << ex) - 0x84; DEC[i] = (sg ? -s : s) / 32768; }
let ac = null, nextT = 0, lastRx = 0;
$('#snd').onclick = () => {
  if (ac) { ac.close(); ac = null; $('#snd').textContent = '🔇 Uključi zvuk'; $('#snd').classList.remove('on'); return; }
  ac = new (window.AudioContext || window.webkitAudioContext)();
  const b = ac.createBuffer(1, 1, 22050); const s = ac.createBufferSource(); s.buffer = b; s.connect(ac.destination); s.start(0);
  $('#snd').textContent = '🔊 Zvuk uključen'; $('#snd').classList.add('on');
  aSince = -1; audioLoop();
};
async function audioLoop(){
  while (ac) {
    try {
      const r = await fetch(`/api/audio?id=${id}&since=${aSince}`);
      aSince = parseInt(r.headers.get('X-Next') || aSince);
      const u = new Uint8Array(await r.arrayBuffer());
      if (u.length && ac) {
        const n = u.length * 3, buf = ac.createBuffer(1, n, 48000), d = buf.getChannelData(0);
        for (let i = 0; i < u.length; i++) { const a = DEC[u[i]], b = DEC[u[Math.min(i + 1, u.length - 1)]]; d[i*3] = a; d[i*3+1] = a + (b - a) / 3; d[i*3+2] = a + 2 * (b - a) / 3; }
        const src = ac.createBufferSource(); src.buffer = buf; src.connect(ac.destination);
        const now = ac.currentTime; if (nextT < now + 0.08) nextT = now + 0.25;
        src.start(nextT); nextT += buf.duration;
        lastRx = Date.now(); $('#rx').style.display = 'block';
      } else if (Date.now() - lastRx > 800) $('#rx').style.display = 'none';
    } catch (e) { await new Promise(r => setTimeout(r, 1000)); }
  }
}
})();
</script>
</body>
</html>
